name: Compilar Cpp para Windows

on: [push]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Copiar Repositorio
      uses: actions/checkout@v4

    - name: Configurar MinGW
      uses: egor-tukin/setup-mingw@v2

    - name: Compilar Codigo Estaticamente
      run: g++ src/main.cpp src/gestao_escolar.cpp -o SistemaEscolar.exe -static

    - name: Guardar o Executavel (.exe)
      uses: actions/upload-artifact@v4
      with:
        name: SistemaEscolar-Portatil
        path: SistemaEscolar.exe
